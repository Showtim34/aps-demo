services:
  db:
    image: postgres:16-alpine
    container_name: aps_lab_db
    environment:
      POSTGRES_DB: apslab
      POSTGRES_USER: apslab
      POSTGRES_PASSWORD: apslab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apslab -d apslab"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aps_lab_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build:
      context: ./backend
    container_name: aps_lab_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://apslab:apslab@db:5432/apslab
      APP_ENV: development
      APP_DEBUG: "true"
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:4000"]'
      MQTT_ENABLED: "true"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_WS_URL: ws://localhost:9001
      MQTT_TELEMETRY_TOPIC: aps/telemetry/measurements
      MQTT_EVENTS_TOPIC_PREFIX: aps/events
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  front:
    build:
      context: ./frontend
    container_name: aps_lab_front
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MQTT_WS_URL: ws://localhost:9001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: sh -c "npm install && npm run dev"

  ops:
    build:
      context: ./frontend-ops
    container_name: aps_lab_ops
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MQTT_WS_URL: ws://localhost:9001
    ports:
      - "4000:4000"
    volumes:
      - ./frontend-ops:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
